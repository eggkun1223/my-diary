<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="나만 쓰는 오프라인 다이어리" />
    <link rel="icon" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>내 일기</title>
    <script>
      // 화면이 그려지기 전에 저장된 테마를 적용해 깜빡임을 막는다
      try { var t = localStorage.getItem('diary-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
